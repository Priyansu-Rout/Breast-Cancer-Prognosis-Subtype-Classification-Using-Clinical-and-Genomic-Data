[project]
name = "npn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyansu-Rout", email = "priyansurout369@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "black>=26.10.0",
    "dvc>=3.67.1",
    "joblib>=1.6.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "mypy>=2.4.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "scikit-survival>=0.28.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "streamlit>=1.65.0",
    "xgboost>=3.4.1",
]

[project.scripts]
npn = "npn:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
